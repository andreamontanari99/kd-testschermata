name: dashboard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie
        run: pip install pillow icalendar recurring-ical-events requests

      - name: Genera l'immagine
        run: python generate.py
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
          BIRTHDAYS_ICAL_URL: ${{ secrets.BIRTHDAYS_ICAL_URL }}
          SECRET_PATH: ${{ secrets.SECRET_PATH }}
          LAT: ${{ vars.LAT }}
          LON: ${{ vars.LON }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
